version: '3.8'

services:
  # 1. Cơ sở dữ liệu PostgreSQL
  core-db:
    image: postgres:15-alpine
    container_name: core-db
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: banking_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - core_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d banking_db"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: always

  # 2. Ứng dụng Spring Boot
  banking-app:
    build:
      context: ./banking-app
      dockerfile: Dockerfile
    image: banking-app:latest
    container_name: banking-app
    ports:
      - "8080:8080"
    environment:
      # Trỏ URL kết nối database tới service core-db
      - SPRING_DATASOURCE_URL=jdbc:postgresql://core-db:5432/banking_db
      - SPRING_DATASOURCE_USERNAME=postgres
      - SPRING_DATASOURCE_PASSWORD=postgres
      - SPRING_JPA_HIBERNATE_DDL_AUTO=update
    depends_on:
      core-db:
        condition: service_healthy
    restart: always

volumes:
  core_db_data:
